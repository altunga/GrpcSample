name: .NET 11 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore GrpcSample.sln

      - name: Build Release
        run: dotnet build GrpcSample.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GrpcSample.sln --configuration Release --no-build --verbosity normal
